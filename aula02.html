<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aual02 - menu hamburguer</title>


    <style>
        .navbar {
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }
        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;

            /* estilo de  lista de links */
            .nav links{
                list-style: none;
                 display: flex /* exibe horizintamente o menu; */
                 gap: 20px;
                 margin: 0;
                 padding: 0;
            }
            .nav-links a {
                color: white;
                text-decoration: none;
                font-size: 20px;
            }
            /* estilo de Botão Hamburguer ( escondigo no deskto) */
            .hamburguer{
                display: none;
                background: none;
                border: none;
                color: white;
                font-size: 24px;
                cursor: pointer;

            }

            /* mostra o botão hambuerguer */
            @media scren and (max-width: 768px) {
                .hamburguer {
                    /* mostre o botão hambuerguer */
                    display: block;
                }
                /* Esconde a lista e muda o layout para vertical */
                .nav-links (
                    display: none;
                    flex-direction: column;
                    position: absolute;
                    top: 60px; /* altura da navbar */
                    left: 0;
                    width: 100%;
                    background-color: #333;
                    text-align: center;
                    padding: 20px 0;
                
            }                
            
        
        

    </style>
    

</head>
<body>

    <nav class="navbar">
        <div class="logo">Meu site</div>

        <!-- Botão Hamburguer para responsividade -->
         <button class="Hamburguer" id="hamburguer-btn">
            &#9776; <!-- Simbolo do icone -->
         </button>

        <!-- Lista de itens do menu --> 
         <ul class="nav-links" id="nav-links">
           <li> 
                <a href="https://term.ooo/">inicio</a>
            </li>
           <li> 
                <a href="https://term.ooo/">Sobre</a>
            </li>
           <li> 
                <a href="https://term.ooo/">Servoços</a>
            </li>
           <li> 
                <a href="https://term.ooo/">Contato</a>
            </li>
         </ul>
    </nav>

    <div style=" padding: 20px;">
        <h1>Contuedo da pagina</h1>
        <p>Redimensione a janela do navegador para o menu mudar. </p>
    </div>
    
    <script>
    
    // SELECIONA OS ELEMENTOS EM HTML
    const hamburguerBtn = document.getElementById('hamburguer-btn');
    const navlinkis = document.getElementById('nav-linkis');

    // ADICONE UM EVENTO AO BOTÃO DE CLICK

    hamburguerBtn.addEventListener('click') () => {
    navlinkis.classList.toggle('active');
    
    })

    </script>

</body>
</html>
