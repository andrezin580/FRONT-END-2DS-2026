<!DOCTYPE html>
    <html lang="pt-br">
    <head>
     <meta charset="UTF-8">
    <title>3 caixas centralizadas</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f0f0f0;
   
}

.container{
    display:flex;
    gap:20px;
}

.caixa{
    width:120px;
    height:120px;
    background-color: blueviolet;
    color:white;
    font-size:40px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="caixa">1</div>
    <div class="caixa">2</div>
    <div class="caixa">3</div>
</div>

</body>
</html>
